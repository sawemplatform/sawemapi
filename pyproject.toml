[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "sawemapi"
dynamic = ["version"]
description = "Client for the SAWEM API"
authors = [
    { name="SAWEM Platform Team", email="sawemplatform@ntcsa.co.za" },
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "requests",
]
classifiers=[
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/sawemplatform/sawemapi"
Repository = "https://github.com/sawemplatform/sawemapi"
Issues = "https://github.com/sawemplatform/sawemapi/issues"
Changelog = "https://github.com/sawemplatform/sawemapi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
pandas = ["pandas"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "sawemapi._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["*.tests", "*.tests.*"]
